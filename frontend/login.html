<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar sesión - NoVa</title>
  <link rel="stylesheet" href="./css/estilos.css">
</head>
<body>

  <main class="contenedor-acceso">
    <section class="tarjeta-acceso">
      <header class="cabecera-acceso">
        <h1>NoVa</h1>
        <p>Inicia sesión para gestionar tus incidencias</p>
      </header>

      <!-- Zona para mostrar mensajes de error -->
      <div id="mensaje-error" class="caja-error oculto" role="alert">
        Nombre de usuario o contraseña incorrectos.
      </div>

      <!-- De momento redirige a tickets.html para probar el flujo visual -->
      <form action="tickets.html" method="get">
        <div class="grupo-campo">
          <label for="usuario">Nombre de usuario</label>
          <input
            type="text"
            id="usuario"
            name="usuario"
            class="campo-entrada"
            placeholder="Introduce tu usuario"
            required
          >
        </div>

        <div class="grupo-campo">
          <label for="contrasena">Contraseña</label>
          <input
            type="password"
            id="contrasena"
            name="contrasena"
            class="campo-entrada"
            placeholder="Introduce tu contraseña"
            required
          >
        </div>

        <button type="submit" class="boton boton-primario boton-completo">
          Iniciar sesión
        </button>
      </form>

      <footer class="pie-acceso">
        <p>¿No tienes cuenta? <a href="registro.html">Ir a registro</a></p>
      </footer>
    </section>
  </main>

</body>
</html>
