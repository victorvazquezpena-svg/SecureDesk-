<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Registro de usuario - NoVa</title>

  <link rel="stylesheet" href="./css/estilos.css">
</head>

<body>

  <main class="contenedor-acceso">

    <section class="tarjeta-acceso">

      <header class="cabecera-acceso">
        <h1>NoVa</h1>
        <p>Crea una cuenta nueva para acceder a la aplicación</p>
      </header>


      <!--
        Zona donde JavaScript mostrará los errores
        devueltos por la API.
      -->
      <div
        id="mensaje-error"
        class="caja-error oculto"
        role="alert">
        El nombre de usuario ya existe o los datos no son válidos.
      </div>


      <!--
        El formulario será gestionado por app.js.

        JavaScript realizará:

        POST /api/register
      -->
      <form id="form-registro">

        <div class="grupo-campo">

          <label for="usuario">
            Nombre de usuario
          </label>

          <input
            type="text"
            id="usuario"
            name="usuario"
            class="campo-entrada"
            placeholder="Elige un nombre de usuario"
            required
          >

        </div>


        <div class="grupo-campo">

          <label for="contrasena">
            Contraseña
          </label>

          <input
            type="password"
            id="contrasena"
            name="contrasena"
            class="campo-entrada"
            placeholder="Crea una contraseña"
            required
          >

        </div>


        <button
          type="submit"
          class="boton boton-primario boton-completo">
          Registrarse
        </button>

      </form>


      <footer class="pie-acceso">

        <p>
          ¿Ya tienes cuenta?
          <a href="login.html">
            Volver al login
          </a>
        </p>

      </footer>

    </section>

  </main>


  <!-- JavaScript de NoVa -->
  <script src="./js/app.js"></script>

</body>

</html>
