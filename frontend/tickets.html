<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Listado de incidencias - NoVa</title>

  <link rel="stylesheet" href="./css/estilos.css">
</head>

<body>

  <header class="barra-superior">

    <div class="contenedor contenido-barra">

      <a href="tickets.html" class="marca-app">
        NoVa
      </a>

      <div class="zona-usuario">

        <span class="usuario-conectado">
          Usuario conectado
        </span>

        <button
          type="button"
          id="boton-logout"
          class="boton boton-secundario boton-pequeno">
          Cerrar sesión
        </button>

      </div>

    </div>

  </header>


  <main class="contenedor contenido-principal">

    <div class="cabecera-seccion">

      <h1>Incidencias</h1>

      <a
        href="tickets-formulario.html"
        class="boton boton-primario">
        + Crear incidencia
      </a>

    </div>


    <!--
      app.js introducirá aquí los tickets
      recibidos desde GET /api/items
    -->
    <section
      id="lista-incidencias"
      class="lista-incidencias"
      aria-label="Listado de incidencias">
    </section>

  </main>


  <script src="./js/app.js"></script>

</body>

</html>
